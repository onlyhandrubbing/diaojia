<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>掉價中｜越等越便宜，但可能被搶走</title>
<meta name="description" content="二手好物每 10 分鐘自動降價，誰先按「我要了」就用當下價格帶走。任何人都能上架自己用不到的東西。">
<meta property="og:title" content="掉價中｜越等越便宜，但可能被搶走">
<meta property="og:description" content="每件東西一直降價，先按先得。你敢等嗎？">
<meta property="og:image" content="https://onlyhandrubbing.github.io/diaojia/og.png">
<meta property="og:url" content="https://onlyhandrubbing.github.io/diaojia/">

<style>
/* A flea-market price board: chalk-white paper, black type, one hot red for the falling price. */
:root{
  --bg:#f3f1ec; --card:#fff; --ink:#151515; --muted:#6f6c66; --line:#dedad2; --soft:#ebe8e1;
  --hot:#e23d1f; --hot-soft:#fde6df; --ok:#1d7a4c;
  --num:"Barlow Condensed","Noto Sans TC",sans-serif;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --card:#1c1c1c; --ink:#f0eee9; --muted:#a29f98; --line:#33312e; --soft:#262523; --hot:#ff6a4a; --hot-soft:#3a1d16; --ok:#5cc48d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1c1c1c; --ink:#f0eee9; --muted:#a29f98; --line:#33312e; --soft:#262523; --hot:#ff6a4a; --hot-soft:#3a1d16; --ok:#5cc48d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none;font-weight:900;font-size:20px;letter-spacing:.02em}
.logo i{font-style:normal;color:var(--hot);font-family:var(--num);font-size:22px;transform:translateY(1px);display:inline-block}
nav{display:flex;gap:4px}
nav a{text-decoration:none;font-size:14px;font-weight:700;padding:6px 10px;border-radius:999px}
nav a.on{background:var(--ink);color:var(--bg)}
nav a.sell{background:var(--hot);color:#fff}
main{padding-block:18px 80px}
.demo{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-bottom:16px}
.hero h1{margin:6px 0 0;font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.2}
.hero p{margin:8px 0 0;color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 10px}
.sec h2{margin:0;font-size:18px;font-weight:900}
.sec small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;text-decoration:none;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.tile .ph{aspect-ratio:1;background:var(--soft);overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .6s}
.tile .b{padding:8px 10px 10px}
.tile h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .p{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price{font-family:var(--num);font-weight:800;color:var(--hot);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile .price{font-size:26px;line-height:1}
.was{font-size:12.5px;color:var(--muted);text-decoration:line-through}
.tile .t{font-size:12px;color:var(--muted);margin-top:2px}
.badge{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px}
.badge.hot{background:var(--hot);color:#fff}
.sold .ph img{filter:grayscale(1) opacity(.6)}
.sold .price{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
/* item */
.back{display:inline-block;margin-bottom:10px;text-decoration:none;color:var(--muted);font-size:14px}
.gal{border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:1;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:filter 1s}
.gal .thumbs{position:absolute;bottom:8px;left:8px;display:flex;gap:6px}
.gal .thumbs button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.55);padding:0;cursor:pointer}
.gal .thumbs button[aria-pressed="true"]{background:#fff}
.blurnote{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px}
.item h1{margin:14px 0 0;font-size:22px;font-weight:900;line-height:1.35}
.meta{color:var(--muted);font-size:13.5px;margin-top:2px}
.board{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.board .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.board .now{font-size:13px;color:var(--muted)}
.board .price{font-size:64px;line-height:.95;display:block}
.board .price.tick{animation:tick .5s ease-out}
@keyframes tick{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.board .next{text-align:right;font-size:13px;color:var(--muted)}
.board .next b{display:block;font-family:var(--num);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--soft);border-radius:3px;margin-top:14px;overflow:hidden}
.track i{display:block;height:100%;background:var(--hot);border-radius:3px;transition:width .6s}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.live{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.live b{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-right:5px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.grab{margin-top:14px;width:100%;border:0;border-radius:12px;background:var(--hot);color:#fff;font-weight:900;font-size:19px;padding:16px;cursor:pointer;letter-spacing:.04em}
.grab:disabled{background:var(--soft);color:var(--muted);cursor:default}
.board .grab .price{display:inline;color:#fff;font-size:26px;margin-left:8px;line-height:1}
.story{margin-top:18px;background:var(--card);border-left:3px solid var(--hot);padding:12px 14px;border-radius:0 10px 10px 0}
.story span{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em}
.facts{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.aff{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;text-decoration:none}
.aff b{color:var(--hot)}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
/* forms */
.form{display:grid;gap:16px}
.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .add{width:92px;height:92px;border:1.5px dashed var(--muted);border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:13px;text-align:center;background:transparent}
.photos .pv{width:92px;height:92px;border-radius:10px;overflow:hidden;position:relative}
.photos .pv img{width:100%;height:100%;object-fit:cover}
.photos .pv button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.preview b{font-family:var(--num);font-size:20px;color:var(--hot)}
.rules{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.rules ul{margin:4px 0 0;padding-left:18px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:auto;margin-top:5px}
.submit{width:100%;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:900;font-size:17px;padding:15px;cursor:pointer}
.submit:disabled{opacity:.5}
/* me */
.mine{display:grid;gap:10px}
.mi{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.mi img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--soft)}
.mi h3{margin:0;font-size:15px}
.mi p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.mi .ct{color:var(--ink);font-weight:700;word-break:break-all}
.mi .tools{margin-top:6px}
/* dialog */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90vh;overflow:auto}
.sheet h3{margin:0;font-size:20px;font-weight:900}
.sheet .big{font-family:var(--num);font-size:48px;color:var(--hot);font-weight:800;line-height:1}
.got{background:var(--hot-soft);border-radius:12px;padding:14px}
.got b{word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.feed{display:grid;gap:6px;font-size:14px}
.feed div{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.feed .price{font-size:20px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--muted)}
.how b{display:block;color:var(--ink);font-size:14.5px}
.fine{margin-top:36px;font-size:12px;color:var(--muted);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/"><span>掉價中</span><i>↓</i></a>
  <nav><a href="#/" data-r="home">逛逛</a><a href="#/me" data-r="me">我的</a><a href="#/sell" data-r="sell" class="sell">上架</a></nav>
</div></header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* ---------- config: fill SUPA to go live; empty = demo mode in this browser ---------- */
const SUPA={url:'',key:''};
const SITE='https://onlyhandrubbing.github.io/diaojia/';
const AFF={id:'16301320039',sub:'diaojia'};
const shopee=kw=>'https://s.shopee.tw/an_redir?origin_link='+encodeURIComponent('https://shopee.tw/search?keyword='+encodeURIComponent(kw))+'&affiliate_id='+AFF.id+'&sub_id='+AFF.sub;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tt;function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('#toast').hidden=true,2600)}
const MIN=60000;
/* price everyone sees between server refreshes (floor unknown to the client: server says at_floor) */
const priceAt=(it,t=Date.now())=>Math.max(it._floor??1,it.start_price-it.step*Math.max(0,Math.floor((t-Date.parse(it.start_at))/MIN/it.interval_min)));
const nextDropIn=(it,t=Date.now())=>{const e=t-Date.parse(it.start_at);if(e<0)return Date.parse(it.start_at)-t;const iv=it.interval_min*MIN;return iv-(e%iv)};
const fmtLeft=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const ago=t=>{const m=Math.round((Date.now()-Date.parse(t))/MIN);return m<1?'剛剛':m<60?m+' 分鐘前':m<1440?Math.round(m/60)+' 小時前':Math.round(m/1440)+' 天前'};

/* ---------- placeholder photos for demo ---------- */
function ph(label,hue){const c=document.createElement('canvas');c.width=c.height=600;const g=c.getContext('2d');
  g.fillStyle=`hsl(${hue} 30% 82%)`;g.fillRect(0,0,600,600);g.fillStyle=`hsl(${hue} 25% 62%)`;g.fillRect(90,140,420,320);
  g.fillStyle=`hsl(${hue} 30% 30%)`;g.font='700 46px "Noto Sans TC",sans-serif';g.textAlign='center';g.fillText(label,300,318);return c.toDataURL('image/jpeg',.8)}

/* ---------- backend: Supabase or local demo ---------- */
let api;
if(SUPA.url){
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  const sb=createClient(SUPA.url,SUPA.key);
  const ensure=async()=>{const{data}=await sb.auth.getSession();if(data.session)return data.session.user.id;const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;return r.data.user.id};
  const err=e=>{const m=String(e?.message||e);return /gone/.test(m)?'gone':/limit/.test(m)?'limit':/own/.test(m)?'own':/early/.test(m)?'early':/too_many/.test(m)?'too_many':m};
  api={
    live:true,
    async list(){const[{data:items,error},{data:pr}]=await Promise.all([sb.from('items').select('*').neq('status','removed').order('created_at',{ascending:false}).limit(120),sb.rpc('prices')]);if(error)throw error;
      const m=new Map((pr||[]).map(p=>[p.id,p]));return items.map(it=>{const p=m.get(it.id);if(p){it._price=p.price;it._atFloor=p.at_floor;if(p.at_floor)it._floor=p.price}return it})},
    async create(f,files){const uid=await ensure();const urls=[];for(const[i,b]of files.entries()){const path=`${uid}/${Date.now()}_${i}.jpg`;const r=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg'});if(r.error)throw r.error;urls.push(sb.storage.from('photos').getPublicUrl(path).data.publicUrl)}
      const{data,error}=await sb.rpc('create_item',{...f,photos:urls});if(error)throw new Error(err(error));return data},
    async claim(id,name,contact){await ensure();const{data,error}=await sb.rpc('claim',{item:id,name,contact});if(error)throw new Error(err(error));return data[0]},
    async mine(){await ensure();const{data,error}=await sb.rpc('my_items');if(error)throw error;return data},
    async relist(id){const{error}=await sb.rpc('relist',{item:id});if(error)throw error},
    async remove(id){const{error}=await sb.rpc('remove_item',{item:id});if(error)throw error},
    async report(id){await ensure();await sb.rpc('report',{item:id})},
    watch(cb){sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},cb).subscribe()},
    presence(id,cb){const ch=sb.channel('room:'+id,{config:{presence:{key:crypto.randomUUID()}}});ch.on('presence',{event:'sync'},()=>cb(Object.keys(ch.presenceState()).length)).subscribe(s=>{if(s==='SUBSCRIBED')ch.track({at:Date.now()})});return()=>sb.removeChannel(ch)}
  };
}else{
  const me=LS.get('dj_me',null)||(()=>{const v='me-'+Math.random().toString(36).slice(2,8);LS.set('dj_me',v);return v})();
  const seed=()=>{const now=Date.now(),mk=(t,story,cond,np,sp,fl,iv,hrs,offMin,hue,label,area)=>{const steps=Math.max(1,Math.floor(hrs*60/iv));return{id:'d'+Math.random().toString(36).slice(2,9),seller:'demo',title:t,story,cond,new_price:np,start_price:sp,step:Math.max(1,Math.ceil((sp-fl)/steps)),interval_min:iv,start_at:new Date(now-offMin*MIN).toISOString(),end_at:new Date(now-offMin*MIN+hrs*3600000).toISOString(),photos:[ph(label,hue)],area,ship:'賣貨便',status:'live',_fl:fl,_contact:'LINE: demo_seller',created_at:new Date(now-offMin*MIN).toISOString()}};
    return[mk('AirPods Pro 第二代','抽獎抽到的，但我已經有一副了。只拆過一次試戴。','近全新',7490,5200,2600,10,24,190,210,'耳機','台北'),
      mk('任天堂 Switch 健身環','買的時候說要每天運動，實際用了三次。','良好',2390,1600,500,10,12,95,140,'健身環','新北'),
      mk('IKEA 落地燈','搬家後新家燈夠亮了，放著佔位置。','良好',1299,700,150,30,24,300,40,'落地燈','台中'),
      mk('前任送的香水 50ml','味道很好聞，但聞到會想到他。用掉大概 1/5。','使用過',3800,1800,300,10,6,20,330,'香水','台北'),
      mk('Kindle Paperwhite','改用手機看書了，螢幕無刮傷。','良好',4290,2800,900,30,48,-90,90,'Kindle','高雄'),
      {...mk('膠囊咖啡機','公司有了，家裡這台用不到。','良好',3990,2200,600,10,12,400,20,'咖啡機','台北'),status:'sold',sold_price:1180,sold_at:new Date(now-25*MIN).toISOString()}]};
  let db=LS.get('dj_db',null);if(!db){db=seed();LS.set('dj_db',db)}
  const save=()=>LS.set('dj_db',db);
  const floorPrice=it=>Math.max(it._fl,it.start_price-it.step*Math.max(0,Math.floor((Date.now()-Date.parse(it.start_at))/MIN/it.interval_min)));
  api={live:false,me,
    async list(){return db.filter(i=>i.status!=='removed').map(i=>{const p=floorPrice(i);const o={...i,_price:p,_atFloor:p<=i._fl};if(o._atFloor)o._floor=p;return o})},
    async create(f,files){const urls=[];for(const b of files)urls.push(await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)}));
      if(db.filter(i=>i.seller===me&&i.status==='live').length>=5)throw new Error('too_many');

    async remove(id){const it=db.find(i=>i.id===id&&i.seller===me);if(it){it.status='removed';save()}},
    async report(){},
    watch(){},presence(){return()=>{}}
  };
}

  const S=1200,k=Math.min(1,S/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let q=.82,b;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.1}while(b.size>900000&&q>.3);return b}

    const bad=!files.length?'至少放一張照片':t.length<2?'寫一下東西名稱':!(sp>=10)?'開價至少 $10':!(fp>=1&&fp<sp)?'底價要比開價低':ct.length<2?'留個聯絡方式，買家才找得到你':!$('#agree').checked?'勾選最下面的確認':'';
    if(bad){toast(bad);return}
    let at=new Date();if(s.when==='later'){const v=$('#at').value;if(!v){toast('選一個開賣時間');return}at=new Date(v);if(at<new Date()){toast('開賣時間要在現在之後');return}}
    const b=$('#sb');b.disabled=true;b.textContent='上架中…';
    try{const id=await api.create({title:t,story:$('#st').value.trim(),cond:$('#cd').value,new_price:n('#np')||null,start_price:sp,floor_price:fp,interval_min:s.iv,hours:s.hrs,start_at:at.toISOString(),area:$('#ar').value.trim(),ship:$('#sh').value,seller_contact:ct},files);
      LS.set('dj_draft',{ct,ar:$('#ar').value,sh:$('#sh').value});await refresh();toast('上架了，開始掉價');location.hash='#/i/'+id}
    catch(x){toast(x.message==='too_many'?'同時最多 5 件在掉價':'上架失敗，再試一次');b.disabled=false;b.textContent='開始掉價'}}}

/* ---------- me ---------- */
async function viewMe(){$('#view').innerHTML=`${demoNote()}<h1 style="margin:4px 0 14px;font-size:26px;font-weight:900">我的</h1><div id="mine" class="mine"><div class="empty">讀取中…</div></div>`;
  let rows=[];try{rows=await api.mine()}catch(e){$('#mine').innerHTML='<div class="empty">讀取失敗</div>';return}
  const sells=rows.filter(r=>r.role==='sell'),buys=rows.filter(r=>r.role==='buy');
  const row=r=>{const img=r.photos?.[0]||'';if(r.role==='buy')return`<div class="mi"><img src="${esc(img)}" alt=""><div><h3>${esc(r.title)}</h3><p>你用 ${money(r.sold_price)} 搶到・${ago(r.sold_at)}</p><p>賣家：<span class="ct">${esc(r.other_contact)}</span></p></div></div>`;
    const st=r.status==='live'?`掉價中・底價 ${money(r.floor_price)}`:r.status==='sold'?`${money(r.sold_price)} 成交・${ago(r.sold_at)}`:'已下架';
    return`<div class="mi"><img src="${esc(img)}" alt=""><div><h3>${esc(r.title)}</h3><p>${st}</p>${r.status==='sold'?`<p>買家 ${esc(r.other_name||'')}：<span class="ct">${esc(r.other_contact||'')}</span></p>`:''}<div class="tools">${r.status==='live'?`<a class="btn" href="#/i/${r.id}">看看</a><button class="btn ghost" data-rm="${r.id}" type="button">下架</button>`:''}${r.status==='sold'?`<button class="btn ghost" data-re="${r.id}" type="button">買家跑了，重新掉價</button>`:''}</div></div></div>`};
  $('#mine').innerHTML=`<div class="sec" style="margin-top:0"><h2>我上架的</h2><small>${sells.length} 件</small></div>${sells.length?sells.map(row).join(''):'<div class="empty">還沒上架東西。<a href="#/sell">上架一件</a></div>'}
  <div class="sec"><h2>我搶到的</h2><small>${buys.length} 件</small></div>${buys.length?buys.map(row).join(''):'<div class="empty">還沒搶到東西。</div>'}`;
  $('#mine').onclick=async e=>{const a=e.target.closest('[data-rm]'),b=e.target.closest('[data-re]');if(a&&confirm('確定下架？')){await api.remove(a.dataset.rm);await refresh();viewMe()}if(b&&confirm('重新從開價開始掉？')){await api.relist(b.dataset.re);await refresh();viewMe()}}}

await refresh();render();
</script>
